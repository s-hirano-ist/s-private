name: SPrivate

options:
  bundleIdPrefix: ist.s-hirano
  deploymentTarget:
    iOS: "27.0"
  xcodeVersion: "27.0"

settings:
  configFiles:
    Debug: Config/Shared.xcconfig
    Release: Config/Shared.xcconfig
  base:
    CODE_SIGN_STYLE: Automatic
    CURRENT_PROJECT_VERSION: 1
    DEVELOPMENT_TEAM: $(IOS_DEVELOPMENT_TEAM)
    GENERATE_INFOPLIST_FILE: YES
    IPHONEOS_DEPLOYMENT_TARGET: "27.0"
    MARKETING_VERSION: 1.0.0
    SWIFT_VERSION: "6.0"
    TARGETED_DEVICE_FAMILY: "1"

packages:
  Auth0:
    url: https://github.com/auth0/Auth0.swift.git
    from: 3.1.0

targets:
  SPrivate:
    type: application
    platform: iOS
    sources:
      - path: SPrivate
      - path: Shared
    dependencies:
      - package: Auth0
      - target: SPrivateShareExtension
        embed: true
    settings:
      base:
        CODE_SIGN_ENTITLEMENTS: SPrivate/SPrivate.entitlements
        INFOPLIST_KEY_CFBundleDisplayName: SPrivate
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        PRODUCT_BUNDLE_IDENTIFIER: ist.s-hirano.s-private
        PRODUCT_NAME: SPrivate
    info:
      path: SPrivate/Info.plist
      properties:
        Auth0ClientId: $(AUTH0_CLIENT_ID)
        Auth0Domain: $(AUTH0_DOMAIN)
        Auth0Audience: $(AUTH0_AUDIENCE)
        MobileAPIBaseURL: $(MOBILE_API_BASE_URL)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleURLTypes:
          - CFBundleTypeRole: Editor
            CFBundleURLName: Auth0
            CFBundleURLSchemes:
              - ist.s-hirano.s-private

  SPrivateShareExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: SPrivateShareExtension
      - path: Shared
    settings:
      base:
        CODE_SIGN_ENTITLEMENTS: SPrivateShareExtension/SPrivateShareExtension.entitlements
        PRODUCT_BUNDLE_IDENTIFIER: ist.s-hirano.s-private.share
        PRODUCT_NAME: SPrivateShareExtension
        SKIP_INSTALL: YES
    info:
      path: SPrivateShareExtension/Info.plist
      properties:
        CFBundleDisplayName: SPrivate
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsImageWithMaxCount: 10
              NSExtensionActivationSupportsText: true
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
  SPrivateTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: SPrivateTests
    dependencies:
      - target: SPrivate
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: ist.s-hirano.s-private.tests

  SPrivateUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: SPrivateUITests
    dependencies:
      - target: SPrivate
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: ist.s-hirano.s-private.ui-tests
        TEST_TARGET_NAME: SPrivate

schemes:
  SPrivate:
    shared: true
    build:
      targets:
        SPrivate: all
        SPrivateTests: [test]
        SPrivateUITests: [test]
    test:
      gatherCoverageData: true
      targets:
        - name: SPrivateTests
        - name: SPrivateUITests
