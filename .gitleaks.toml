[extend]
useDefault = true

[[rules]]
id = "project-database-url"
description = "Database URL with embedded credentials"
regex = '''(?i)(?:DATABASE_URL|DIRECT_URL)\s*[:=]\s*["'][a-z][a-z0-9+.-]*://[^\s"']+:[^\s"']+@'''
keywords = ["DATABASE_URL", "DIRECT_URL"]

[rules.allowlist]
paths = [
	'''^apps/web/vitest-setup\.tsx$''',
	'''^\.github/workflows/ci-check\.yaml$''',
	'''^\.github/workflows/ci-reporting-check\.yaml$''',
]

[[rules]]
id = "project-secret-assignment"
description = "Project secret environment variable assigned a literal value"
regex = '''(?i)(?:AUTH_SECRET|AUTH0_CLIENT_SECRET|PUSHOVER_APP_TOKEN|MINIO_SECRET_KEY|CF_ACCESS_CLIENT_SECRET)\s*[:=]\s*["'][A-Za-z0-9_+/.=-]{16,}'''
keywords = [
	"AUTH_SECRET",
	"AUTH0_CLIENT_SECRET",
	"PUSHOVER_APP_TOKEN",
	"MINIO_SECRET_KEY",
	"CF_ACCESS_CLIENT_SECRET",
]

[rules.allowlist]
paths = [
	'''^apps/web/vitest-setup\.tsx$''',
	'''^docs/vps-deployment\.md$''',
	'''^\.github/workflows/ci-check\.yaml$''',
	'''^\.github/workflows/ci-reporting-check\.yaml$''',
]

[[allowlists]]
description = "Generated files and dependency metadata"
paths = [
	'''(^|/)node_modules/''',
	'''^apps/ios/\.derivedData/''',
	'''^apps/ios/Packages/[^/]+/\.build/''',
	'''(^|/)docs/api/''',
	'''(^|/)pnpm-lock\.yaml$''',
	'''^packages/database/src/generated/''',
	'''(^|/)apps/web/\.next/''',
	'''(^|/)\.storybook-static/''',
	'''(^|/)\.storybook-ui-static/''',
	'''(^|/)\.vitest-coverage/''',
	'''(^|/)playwright-report/''',
	'''(^|/)test-results/''',
	'''(^|/)reports/mutation/''',
	'''(^|/)\.stryker-tmp/''',
	'''(^|/)apps/ios/.derivedData/''',
	'''^apps/ios/Config/Local\.xcconfig$''',
]

[[allowlists]]
description = "Allow UUIDv7 fixture keys in content query tests"
condition = "AND"
regexTarget = "match"
regexes = ['''key:\s*"01912c9a-5e8a-7b5c-8a1b-2c3d4e5f6a[0-9a-f]"''']
paths = [
	'''^apps/web/src/application-services/articles/get-articles\.test\.ts$''',
	'''^apps/web/src/application-services/notes/get-notes\.test\.ts$''',
]

[[allowlists]]
description = "Auth0 Native Application client ID is a public identifier"
condition = "AND"
regexTarget = "secret"
regexes = ['''^Yw1XrV8ERzChXuDXM7dYenvgeUcQfELS$''']
paths = ['''^apps/ios/Config/Shared\.xcconfig$''']
