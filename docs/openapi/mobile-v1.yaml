openapi: 3.1.0
info:
  title: SPrivate Mobile API
  version: 1.1.0
  description: >-
    Authenticated iPhone API scoped to the linked Better Auth user. Mutations require an operationId UUID.
    Successful operations are durable and safe to retry with the same canonical input.
servers:
  - url: /api/mobile/v1
security:
  - bearerAuth: []
paths:
  /manifest:
    get:
      operationId: listMobileManifest
      description: Owner-scoped IDs and update times for complete local reconciliation. Image entries include their metadata so the client can display them without additional list or detail requests. Fetch changed records in other domains through the detail endpoint. A successful full response also identifies remote deletions.
      responses:
        '200':
          description: Complete manifest and categories
          content:
            application/json:
              schema:
                type: object
                required: [articles, notes, books, images, categories]
                properties:
                  articles: { $ref: '#/components/schemas/ManifestItems' }
                  notes: { $ref: '#/components/schemas/ManifestItems' }
                  books: { $ref: '#/components/schemas/ManifestItems' }
                  images:
                    type: array
                    items:
                      $ref: '#/components/schemas/Image'
                  categories:
                    type: array
                    items:
                      type: object
                      required: [id, name]
                      properties:
                        id: { type: string }
                        name: { type: string }
        default:
          $ref: '#/components/responses/Error'
  /{domain}:
    parameters:
      - $ref: '#/components/parameters/domain'
    get:
      operationId: listContent
      parameters:
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/Status'
        - name: offset
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 30
      responses:
        '200':
          description: Paginated domain records
          content:
            application/json:
              schema:
                type: object
                required: [data, totalCount, offset, limit]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Content'
                  totalCount:
                    type: integer
                  offset:
                    type: integer
                  limit:
                    type: integer
        default:
          $ref: '#/components/responses/Error'
    post:
      operationId: createContent
      description: >-
        Articles and notes accept JSON. Images and books use the resumable upload endpoints.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - $ref: '#/components/schemas/ArticleCreate'
                - $ref: '#/components/schemas/NoteCreate'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
                required: [accepted, operationId, resource]
                properties:
                  accepted:
                    type: boolean
                    const: true
                  operationId:
                    type: string
                    format: uuid
                  resource:
                    $ref: '#/components/schemas/ResourceReference'
        default:
          $ref: '#/components/responses/Error'
  /{domain}/{id}:
    parameters:
      - $ref: '#/components/parameters/domain'
      - $ref: '#/components/parameters/id'
    get:
      operationId: getContent
      responses:
        '200':
          description: Owner-scoped content record
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Content'
        default:
          $ref: '#/components/responses/Error'
    delete:
      operationId: deleteContent
      description: Only UNEXPORTED records can be deleted.
      responses:
        '204':
          description: Deleted
        default:
          $ref: '#/components/responses/Error'
  /categories:
    get:
      operationId: listCategories
      responses:
        '200':
          description: Article categories owned by the user
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      required: [id, name]
                      properties:
                        id:
                          type: string
                        name:
                          type: string
        default:
          $ref: '#/components/responses/Error'
  /search:
    get:
      operationId: searchContent
      parameters:
        - name: query
          in: query
          required: true
          schema:
            type: string
            minLength: 1
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 20
      responses:
        '200':
          description: Owner-matched search references
          content:
            application/json:
              schema:
                type: object
                required: [data, query]
                properties:
                  query:
                    type: string
                  data:
                    type: array
                    items:
                      type: object
                      required: [id, type, title, snippet]
                      properties:
                        id:
                          type: string
                        type:
                          type: string
                          enum: [articles, notes, books]
                        title:
                          type: string
                        snippet:
                          type: string
        default:
          $ref: '#/components/responses/Error'
  /media/{domain}/{id}/{variant}:
    parameters:
      - name: domain
        in: path
        required: true
        schema:
          type: string
          enum: [images, books]
      - $ref: '#/components/parameters/id'
      - name: variant
        in: path
        required: true
        schema:
          type: string
          enum: [original, thumbnail]
    get:
      operationId: getMedia
      responses:
        '200':
          description: Owner-scoped image bytes
          content:
            image/jpeg: {}
            image/png: {}
            image/webp: {}
        default:
          $ref: '#/components/responses/Error'
  /uploads:
    post:
      operationId: startUpload
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UploadStart'
      responses:
        '201':
          description: Created or resumed upload session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadSession'
        default:
          $ref: '#/components/responses/Error'
  /uploads/{id}:
    parameters:
      - $ref: '#/components/parameters/id'
    get:
      operationId: getUpload
      responses:
        '200':
          description: Owner-scoped upload state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadSession'
        default:
          $ref: '#/components/responses/Error'
    delete:
      operationId: cancelUpload
      responses:
        '204':
          description: Upload cancelled and temporary chunks removed
        default:
          $ref: '#/components/responses/Error'
  /uploads/{id}/chunks/{part}:
    parameters:
      - $ref: '#/components/parameters/id'
      - name: part
        in: path
        required: true
        schema:
          type: integer
          minimum: 0
    put:
      operationId: putUploadChunk
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
              maxLength: 1048576
      responses:
        '200':
          description: Chunk accepted; sending the same part again replaces it
        default:
          $ref: '#/components/responses/Error'
  /uploads/{id}/complete:
    parameters:
      - $ref: '#/components/parameters/id'
    post:
      operationId: completeUpload
      responses:
        '201':
          description: Content created or previous result returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateResult'
        default:
          $ref: '#/components/responses/Error'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    domain:
      name: domain
      in: path
      required: true
      schema:
        type: string
        enum: [articles, notes, images, books]
    id:
      name: id
      in: path
      required: true
      schema:
        type: string
  schemas:
    ManifestItems:
      type: array
      items:
        type: object
        required: [id, updatedAt]
        properties:
          id: { type: string }
          updatedAt: { type: string, format: date-time }
    Status:
      type: string
      enum: [UNEXPORTED, LAST_UPDATED, EXPORTED]
    Content:
      oneOf:
        - $ref: '#/components/schemas/Article'
        - $ref: '#/components/schemas/Note'
        - $ref: '#/components/schemas/Image'
        - $ref: '#/components/schemas/Book'
    ContentBase:
      type: object
      required: [id, status, createdAt, updatedAt]
      properties:
        id:
          type: string
        status:
          $ref: '#/components/schemas/Status'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        exportedAt:
          type: [string, 'null']
          format: date-time
      additionalProperties: true
    Article:
      allOf:
        - $ref: '#/components/schemas/ContentBase'
        - type: object
          required: [title, url, categoryId, categoryName]
          properties:
            title:
              type: string
            url:
              type: string
              format: uri
            quote:
              type: [string, 'null']
            categoryId:
              type: string
            categoryName:
              type: string
    Note:
      allOf:
        - $ref: '#/components/schemas/ContentBase'
        - type: object
          required: [title, markdown]
          properties:
            title:
              type: string
            markdown:
              type: string
    Image:
      allOf:
        - $ref: '#/components/schemas/ContentBase'
        - type: object
          required: [path, contentType]
          properties:
            path:
              type: string
            contentType:
              type: string
            fileSize:
              type: [integer, 'null']
            width:
              type: [integer, 'null']
            height:
              type: [integer, 'null']
    Book:
      allOf:
        - $ref: '#/components/schemas/ContentBase'
        - type: object
          required: [isbn, title, rating, tags]
          properties:
            isbn:
              type: string
            title:
              type: string
            markdown:
              type: [string, 'null']
            imagePath:
              type: [string, 'null']
            rating:
              type: integer
            tags:
              type: array
              items:
                type: string
    ArticleCreate:
      type: object
      required: [operationId, title, url, category]
      properties:
        operationId:
          type: string
          format: uuid
        title:
          type: string
        url:
          type: string
          format: uri
        category:
          type: string
        quote:
          type: string
    NoteCreate:
      type: object
      required: [operationId, title, markdown]
      properties:
        operationId:
          type: string
          format: uuid
        title:
          type: string
        markdown:
          type: string
    ResourceReference:
      type: object
      required: [id, type]
      properties:
        id:
          type: string
        type:
          type: string
          enum: [articles, notes, images, books]
    CreateResult:
      type: object
      required: [accepted, operationId, resource]
      properties:
        accepted:
          type: boolean
          const: true
        operationId:
          type: string
          format: uuid
        resource:
          $ref: '#/components/schemas/ResourceReference'
    UploadStart:
      type: object
      required: [operationId, domain, contentType, fileSize, metadata]
      properties:
        operationId:
          type: string
          format: uuid
        domain:
          type: string
          enum: [images, books]
        contentType:
          type: string
          enum: [image/jpeg, image/png, image/webp]
        fileSize:
          type: integer
          minimum: 1
          maximum: 10485760
        metadata:
          type: object
          additionalProperties:
            type: string
    UploadSession:
      type: object
      required: [uploadId, operationId, chunkSize, receivedParts, expiresAt]
      properties:
        uploadId:
          type: string
        operationId:
          type: string
          format: uuid
        chunkSize:
          type: integer
          const: 1048576
        receivedParts:
          type: array
          items:
            type: integer
        expiresAt:
          type: string
          format: date-time
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code]
          properties:
            code:
              type: string
              enum: [UNAUTHORIZED, FORBIDDEN, NOT_FOUND, VALIDATION_ERROR, DUPLICATE, NOT_DELETABLE, UPLOAD_TOO_LARGE, OPERATION_CONFLICT, OPERATION_IN_PROGRESS, INVALID_CHUNK_SIZE, UPLOAD_INCOMPLETE, UPLOAD_EXPIRED, MOBILE_API_UNAVAILABLE, INTERNAL_ERROR]
  responses:
    Error:
      description: Stable error code; never a login redirect.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
