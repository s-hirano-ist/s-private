services:
  cockroachdb:
    image: cockroachdb/cockroach:v26.3.4@sha256:e9a8c0a4f23e53cceabff8cd6e853a97ba589f7dfe41e7975f17c1279eca27ea
    profiles: [local]
    restart: unless-stopped
    command: start-single-node --insecure
    ports:
      - "26257:26257"
      - "8080:8080"
    volumes:
      - cockroach-data:/cockroach/cockroach-data
    healthcheck:
      test: ["CMD", "cockroach", "sql", "--insecure", "-e", "SELECT 1"]
      interval: 5s
      timeout: 5s
      retries: 20

  qdrant:
    image: qdrant/qdrant:v1.20.0@sha256:9bfc89f9914fc14876a88c05270685921a55b8877b254a98bcc1cc2f0a424cd2
    profiles: [local]
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant-data:/qdrant/storage
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "bash -c 'exec 3<>/dev/tcp/127.0.0.1/6333; printf \"GET /healthz HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n\" >&3; grep -q \"200 OK\" <&3'",
        ]
      interval: 5s
      timeout: 5s
      retries: 20

  embedding-api:
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-1.9@sha256:2538ea1c9640d3763b15af668039d24172d063b42337b0c27796fc2be180c78d
    profiles: [local]
    platform: linux/amd64
    restart: unless-stopped
    command: >-
      --model-id ${EMBEDDING_MODEL}
      --port 3001
      --pooling mean
    ports:
      - "127.0.0.1:3001:3001"
    volumes:
      - hf-cache:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/health"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 120s

  local-minio:
    image: pgsty/minio:RELEASE.2026-02-14T12-00-00Z@sha256:00c404465c4e7c4fd716d98caec2928e9e0f82c3548615662fdd3866ea9a28c0
    profiles: [local]
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER:-}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD:-}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    networks:
      - tunnel-net
    healthcheck:
      test: ["CMD", "minio", "--version"]
      interval: 5s
      timeout: 3s
      retries: 10

  local-minio-init:
    image: pgsty/mc:RELEASE.2026-03-13T08-57-32Z@sha256:25f84fb22b86b7cf9006bff591cff247efff12b02caebbe94b020310f5523917
    profiles: [local]
    depends_on:
      local-minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://local-minio:9000 $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD}; do sleep 1; done &&
      mc mb --ignore-existing local/$${S3_BUCKET_NAME} &&
      echo 'Bucket ready' &&
      tail -f /dev/null
      "
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER:-}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD:-}
      - S3_BUCKET_NAME=${S3_BUCKET_NAME:-}
    networks:
      - tunnel-net

  minio:
    image: pgsty/minio:RELEASE.2026-02-14T12-00-00Z-amd64@sha256:e6238b30c37e1143d80b71a6bea91446587009df5d7839f14659b11087d651fb
    container_name: minio
    profiles: [vps]
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER:-}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD:-}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    networks:
      - tunnel-net
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 30s
      timeout: 3s
      retries: 3

  minio-init:
    image: pgsty/mc:RELEASE.2026-03-13T08-57-32Z-amd64@sha256:27e3c66b01d1e3922e0a9bd3eb9f532cb52f448942b7f5e37bae8d313835eb22
    container_name: minio-init
    profiles: [vps]
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD} &&
      mc mb --ignore-existing local/$${S3_BUCKET_NAME} &&
      echo 'Bucket ready'
      "
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER:-}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD:-}
      - S3_BUCKET_NAME=${S3_BUCKET_NAME:-}
    networks:
      - tunnel-net

  cloudflared:
    image: cloudflare/cloudflared:latest@sha256:4955524aeaa379e154023d5a027c250f7b35041a2e7e950cf13f144bc9b9c5ba
    container_name: cloudflared
    profiles: [vps]
    restart: unless-stopped
    command: tunnel run
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN:-}
    networks:
      - tunnel-net

volumes:
  cockroach-data:
  hf-cache:
  minio-data:
  qdrant-data:

networks:
  tunnel-net:
    driver: bridge
