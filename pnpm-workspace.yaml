packages:
  - app
  - services/*
  - packages/*

catalog:
  '@tailwindcss/postcss': 4.3.3
  '@tailwindcss/typography': 0.5.20
  '@types/node': 24.13.5
  '@types/react': 19.3.0
  '@types/react-dom': 19.3.0
  js-yaml: 5.4.2
  lefthook: 2.1.14
  lucide-react: 1.47.0
  next: 16.3.5
  next-intl: 4.14.5
  oxfmt: 0.68.0
  postcss: 8.5.28
  react: 19.3.0
  react-dom: 19.3.0
  tailwindcss: 4.3.3
  typescript: 6.0.3
  vite: 8.3.0
  zod: 4.6.5

catalogMode: prefer
catalogPrune: true
savePrefix: ''

allowBuilds:
  '@parcel/watcher': true
  '@prisma/engines': true
  '@sentry/cli': true
  '@swc/core': true
  esbuild: true
  lefthook: true
  prisma: true
  puppeteer: true
  sharp: false
  sleep: true
  unrs-resolver: true

# pnpm supply-chain security hardening
minimumReleaseAge: 1440
minimumReleaseAgeStrict: true
minimumReleaseAgeIgnoreMissingTime: false
minimumReleaseAgeExclude:
  - '@turbo/darwin-64@2.11.2'
  - '@turbo/darwin-arm64@2.11.2'
  - '@turbo/linux-64@2.11.2'
  - '@turbo/linux-arm64@2.11.2'
  - '@turbo/windows-64@2.11.2'
  - '@turbo/windows-arm64@2.11.2'
  - 'eslint@10.11.0'
  - 'jscpd-darwin-arm64@5.3.0'
  - 'jscpd-darwin-x64@5.3.0'
  - 'jscpd-linux-arm64-gnu@5.3.0'
  - 'jscpd-linux-arm64-musl@5.3.0'
  - 'jscpd-linux-x64-gnu@5.3.0'
  - 'jscpd-linux-x64-musl@5.3.0'
  - 'jscpd-windows-arm64-msvc@5.3.0'
  - 'jscpd-windows-x64-msvc@5.3.0'
  - 'jscpd@5.3.0'
  - 'turbo@2.11.2'
trustPolicy: no-downgrade
trustPolicyIgnoreAfter: 10080
trustLockfile: false
strictDepBuilds: true
blockExoticSubdeps: true
