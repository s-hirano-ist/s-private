packages:
  - app
  - services/*
  - packages/*

catalog:
  '@tailwindcss/postcss': 4.3.3
  '@tailwindcss/typography': 0.5.20
  '@types/node': 24.13.5
  '@types/react': 19.3.0
  '@types/react-dom': 19.3.0
  js-yaml: 5.4.2
  lefthook: 2.1.14
  lucide-react: 1.47.0
  next: 16.3.5
  next-intl: 4.14.5
  oxfmt: 0.68.0
  postcss: 8.5.28
  react: 19.3.0
  react-dom: 19.3.0
  tailwindcss: 4.3.3
  typescript: 7.0.2
  vite: 8.3.0
  zod: 4.6.5

catalogMode: prefer
catalogPrune: true
savePrefix: ''

allowBuilds:
  '@parcel/watcher': true
  '@prisma/engines': true
  '@sentry/cli': true
  '@swc/core': true
  esbuild: true
  lefthook: true
  prisma: true
  puppeteer: true
  sharp: false
  sleep: true
  unrs-resolver: true

# pnpm supply-chain security hardening
minimumReleaseAge: 1440
minimumReleaseAgeStrict: true
minimumReleaseAgeIgnoreMissingTime: false
trustPolicy: no-downgrade
trustPolicyIgnoreAfter: 10080
trustLockfile: false
strictDepBuilds: true
blockExoticSubdeps: true
