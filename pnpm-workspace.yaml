packages:
  - apps/*
  - packages/*

tasks:
  build:
    dependsOn:
      - ^build
    outputs:
      - dist*/**
      - .next*/**
      - '*/generated*/**'
      - erd*/**
    env:
      - AUTH0_CLIENT_ID
      - AUTH0_CLIENT_SECRET
      - AUTH0_ISSUER_BASE_URL
      - AUTH_SECRET
      - BACKEND_URL
      - BETTER_AUTH_URL
      - CI
      - DATABASE_URL
      - EMBEDDING_URL
      - EMBEDDING_MODEL
      - EMBEDDING_VECTOR_SIZE
      - LOCAL_AUTH_EMAIL
      - LOCAL_AUTH_NAME
      - LOCAL_AUTH_PASSWORD
      - LOCAL_DEV_MODE
      - MOBILE_API_AUDIENCE
      - NEXT_PUBLIC_SENTRY_DSN
      - NEXT_PUBLIC_SENTRY_TRACES_SAMPLE_RATE
      - NEXT_PUBLIC_WEB_PUSH_PUBLIC_KEY
      - NODE_EXTRA_CA_CERTS
      - NODE_TLS_REJECT_UNAUTHORIZED
      - PUSHOVER_APP_TOKEN
      - PUSHOVER_URL
      - PUSHOVER_USER_KEY
      - S3_ENDPOINT
      - S3_REGION
      - S3_BUCKET_NAME
      - S3_ACCESS_KEY_ID
      - S3_SECRET_ACCESS_KEY
      - S3_FORCE_PATH_STYLE
      - QDRANT_API_KEY
      - QDRANT_COLLECTION_NAME
      - QDRANT_URL
      - SENTRY_AUTH_TOKEN
      - SENTRY_RELEASE
      - SENTRY_REPORT_URL
      - SKIP_ENV_VALIDATION
      - VERCEL
      - VERCEL_ENV
      - VERCEL_GIT_COMMIT_SHA
      - VERCEL_RELATED_PROJECTS

pipelines:
  build:
    - build

catalog:
  '@aws-sdk/client-s3': 3.1178.0
  '@modelcontextprotocol/client': 2.4.0
  '@modelcontextprotocol/hono': 2.0.2
  '@modelcontextprotocol/server': 2.4.0
  '@nodable/entities': 3.1.0
  '@s-hirano-ist/s-api-client': workspace:*
  '@s-hirano-ist/s-database': workspace:*
  '@sentry/node': 11.19.0
  '@tailwindcss/postcss': 4.3.5
  '@tailwindcss/typography': 0.5.20
  '@types/node': 26.6.11
  '@types/react': 19.3.3
  '@types/react-dom': 19.3.0
  '@vercel/related-projects': 1.1.1
  '@vitest/browser': 5.1.2
  '@vitest/browser-playwright': 5.1.2
  '@vitest/coverage-v8': 5.1.2
  fast-xml-parser: 5.12.1
  fast-xml-validator: 1.4.4
  fflate: 0.8.3
  hono: 4.13.23
  ipaddr.js: 2.5.0
  js-yaml: 5.5.0
  lefthook: 2.2.4
  lucide-react: 1.81.0
  next: 16.4.6
  next-intl: 4.16.2
  oxfmt: 0.80.0
  postcss: 8.5.33
  react: 19.3.1
  react-dom: 19.3.1
  tailwindcss: 4.3.5
  typescript: 6.0.3
  vite: 8.4.0
  vite-plus: 1.8.0
  vitest: 5.1.2
  zod: 4.6.7

catalogMode: prefer
catalogPrune: true
savePrefix: ''

allowBuilds:
  '@parcel/watcher': true
  '@prisma/engines': true
  '@sentry/cli': true
  '@swc/core': true
  esbuild: true
  lefthook: true
  prisma: true
  puppeteer: true
  sharp: false
  sleep: true
  unrs-resolver: true

# pnpm supply-chain security hardening
minimumReleaseAge: 1440
minimumReleaseAgeStrict: true
minimumReleaseAgeIgnoreMissingTime: false
trustPolicy: no-downgrade
trustPolicyIgnoreAfter: 10080
trustLockfile: false
strictDepBuilds: true
blockExoticSubdeps: true
minimumReleaseAgeExclude:
  # Renovate security update: happy-dom@21.0.4
  - happy-dom@21.0.4
  # Renovate security update: @vitest/browser@5.0.5
  - "@vitest/browser@5.0.5"
  # Renovate security update: next@16.4.1
  - next@16.4.1
  # Renovate security update: vite@8.3.3
  - vite@8.3.3
  # Renovate security update: vite-plus@1.3.0
  - vite-plus@1.3.0
