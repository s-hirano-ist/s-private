packages:
  - app
  - services/*
  - packages/*

savePrefix: ''

overrides:
  '@hono/node-server@<1.19.13': '^2.1.1'
  '@tootallnate/once@<3.0.1': '^3.0.1'
  'ajv@>=7.0.0-alpha.0 <8.18.0': '^8.20.0'
  'brace-expansion@>=5.0.0 <5.0.6': '^5.0.9'
  'minimatch@>=10.0.0 <10.2.3': '^10.2.6'
  'mermaid@>=11.0.0-alpha.1 <=11.14.0': '^11.16.1'
  'path-to-regexp@<6.3.0': '^8.4.2'
  'path-to-regexp@>=8.0.0 <8.4.0': '^8.4.2'
  'postcss@<8.5.10': '^8.5.26'
  'qs@>=6.11.1 <=6.15.1': '^6.15.3'
  'smol-toml@<1.6.1': '^1.8.0'
  'srvx@<0.11.13': '^0.12.5'
  'tar@<7.5.8': '^7.5.22'
  'undici@<6.27.0': '^8.10.0'
  'undici@>=7.0.0 <7.28.0': '^8.10.0'
  'ws@>=8.0.0 <8.20.1': '^8.21.3'
  'hono@<4.12.25': '^4.13.2'
  'dompurify@<=3.4.10': '^3.4.13'
  'esbuild@>=0.27.3 <0.28.1': '^0.28.2'
  'markdown-it@<=14.1.1': '^15.0.0'
  '@opentelemetry/core@<2.8.0': '^2.10.0'
  'linkify-it@<=5.0.0': '^6.1.0'
  'js-yaml@<3.15.0': '^5.3.0'
  'js-yaml@>=4.0.0 <=4.1.1': '^5.3.0'

allowBuilds:
  '@parcel/watcher': true
  '@prisma/engines': true
  '@sentry/cli': true
  '@swc/core': true
  dprint: true
  esbuild: true
  prisma: true
  puppeteer: true
  sharp: false
  sleep: true
  unrs-resolver: true

# pnpm 11 supply-chain security hardening
strictDepBuilds: true
blockExoticSubdeps: true
patchedDependencies:
  eslint-plugin-unicorn@70.0.0: patches/eslint-plugin-unicorn@70.0.0.patch
