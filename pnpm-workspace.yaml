packages:
  - app
  - services/*
  - packages/*

tasks:
  build:
    dependsOn:
      - ^build
    outputs:
      - dist*/**
      - .next*/**
      - '*/generated*/**'
      - erd*/**
    env:
      - AUTH0_CLIENT_ID
      - AUTH0_CLIENT_SECRET
      - AUTH0_ISSUER_BASE_URL
      - AUTH_SECRET
      - BACKEND_URL
      - BETTER_AUTH_URL
      - CI
      - DATABASE_URL
      - EMBEDDING_URL
      - EMBEDDING_MODEL
      - EMBEDDING_VECTOR_SIZE
      - LOCAL_AUTH_EMAIL
      - LOCAL_AUTH_NAME
      - LOCAL_AUTH_PASSWORD
      - LOCAL_DEV_MODE
      - MOBILE_API_AUDIENCE
      - NEXT_PUBLIC_SENTRY_DSN
      - NEXT_PUBLIC_WEB_PUSH_PUBLIC_KEY
      - NODE_EXTRA_CA_CERTS
      - NODE_TLS_REJECT_UNAUTHORIZED
      - PUSHOVER_APP_TOKEN
      - PUSHOVER_URL
      - PUSHOVER_USER_KEY
      - S3_ENDPOINT
      - S3_REGION
      - S3_BUCKET_NAME
      - S3_ACCESS_KEY_ID
      - S3_SECRET_ACCESS_KEY
      - S3_FORCE_PATH_STYLE
      - QDRANT_API_KEY
      - QDRANT_COLLECTION_NAME
      - QDRANT_URL
      - SENTRY_AUTH_TOKEN
      - SENTRY_REPORT_URL
      - SKIP_ENV_VALIDATION
      - VERCEL
      - VERCEL_ENV
      - VERCEL_RELATED_PROJECTS

pipelines:
  build:
    - build

catalog:
  '@aws-sdk/client-s3': 3.1156.0
  '@s-hirano-ist/s-api-client': workspace:*
  '@tailwindcss/postcss': 4.3.3
  '@tailwindcss/typography': 0.5.20
  '@types/node': 24.19.1
  '@types/react': 19.3.0
  '@types/react-dom': 19.3.0
  '@vercel/related-projects': 1.1.1
  '@vitest/browser': 5.0.3
  '@vitest/browser-playwright': 5.0.3
  '@vitest/coverage-v8': 5.0.3
  hono: 4.13.13
  istanbul-lib-coverage: 3.2.2
  js-yaml: 5.4.2
  json5: 2.2.3
  lefthook: 2.1.17
  lucide-react: 1.52.0
  next: 16.3.8
  next-intl: 4.14.9
  oxfmt: 0.72.0
  postcss: 8.5.29
  react: 19.3.0
  react-dom: 19.3.0
  tailwindcss: 4.3.3
  typescript: 6.0.3
  vite: 8.3.2
  vite-plus: 1.0.0
  vitest: 5.0.3
  zod: 4.6.5

catalogMode: prefer
catalogPrune: true
savePrefix: ''

allowBuilds:
  '@parcel/watcher': true
  '@prisma/engines': true
  '@sentry/cli': true
  '@swc/core': true
  esbuild: true
  lefthook: true
  prisma: true
  puppeteer: true
  sharp: false
  sleep: true
  unrs-resolver: true

# pnpm supply-chain security hardening
minimumReleaseAge: 1440
minimumReleaseAgeStrict: true
minimumReleaseAgeIgnoreMissingTime: false
trustPolicy: no-downgrade
trustPolicyIgnoreAfter: 10080
trustLockfile: false
strictDepBuilds: true
blockExoticSubdeps: true
minimumReleaseAgeExclude:
  # Renovate security update: happy-dom@21.0.4
  - happy-dom@21.0.4
