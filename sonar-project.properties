# Organization and project keys are supplied by GitHub Actions repository variables.
sonar.host.url=https://sonarcloud.io
sonar.sourceEncoding=UTF-8

# CI derives exact exclusions from Git so only workspace TS/JS source is analyzed.
# The Cloud analysis-scope UX ignores sonar.sources/tests and inclusion properties.
# Tests are excluded rather than counted as production code.
sonar.exclusions=**/node_modules/**,**/dist/**,**/generated/**

sonar.javascript.lcov.reportPaths=.vitest-coverage/lcov.info
# Match the existing Vitest coverage scope; excluded code is still analyzed.
sonar.coverage.exclusions=packages/database/**,packages/storage/**,packages/scripts/**,**/types.ts,packages/core/**/*.interface.ts,apps/web/src/env.ts,packages/search/src/config.ts,apps/web/src/app/[locale]/**,apps/web/src/app/layout.tsx,apps/web/src/app/not-found.tsx,apps/web/src/app/error.tsx,apps/web/src/app/global-error.tsx,apps/web/src/app/manifest.ts,apps/web/src/app/robots.ts,apps/web/src/loaders/**

# Trial results are informational and do not wait for or enforce the quality gate.
sonar.qualitygate.wait=false
