name: depcruise
permissions: {}

on:
  pull_request:

jobs:
  report:
    permissions:
      contents: read
      pull-requests: write
    timeout-minutes: 10
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout files
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          submodules: true

      - uses: $/.github/actions/setup-pnpm

      - name: Check dependency boundaries
        id: check
        run: pnpm deps:check

      - name: Generate dependency graph
        if: ${{ !cancelled() && steps.check.outcome != 'skipped' }}
        run: pnpm deps:graph

      - name: Upload dependency graph
        id: graph
        if: ${{ !cancelled() && steps.check.outcome != 'skipped' }}
        uses: actions/upload-artifact@v7.0.2
        with:
          name: dependency-graph
          path: dependency-graph.md
          if-no-files-found: error
          retention-days: 14

      - name: Report dependency check
        if: ${{ !cancelled() && github.event.pull_request.head.repo.full_name == github.repository }}
        uses: actions/github-script@v9.0.0
        env:
          CHECK_OUTCOME: ${{ steps.check.outcome }}
          GRAPH_URL: ${{ steps.graph.outputs.artifact-url }}
        with:
          script: |
            const marker = '<!-- dependency-cruiser-report -->';
            const result = process.env.CHECK_OUTCOME;
            const graph = process.env.GRAPH_URL;
            const run = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = `${marker}\n## Dependency check: ${result}\n\n[Workflow results](${run})${graph ? ` · [Dependency graph](${graph})` : ''}`;
            const comments = await github.paginate(github.rest.issues.listComments, {
              ...context.repo, issue_number: context.issue.number,
            });
            const previous = comments.find(comment => comment.user.type === 'Bot' && comment.body?.includes(marker));
            if (previous) {
              await github.rest.issues.updateComment({ ...context.repo, comment_id: previous.id, body });
            } else {
              await github.rest.issues.createComment({ ...context.repo, issue_number: context.issue.number, body });
            }
