name: github-actions-lint

on:
  pull_request:
    paths:
      - .github/actionlint.yaml
      - .github/ghalint.yaml
      - .github/workflows/actions.lock
      - .github/workflows/*.yaml
      - .github/workflows/*.yml
      - .github/actions/**
  workflow_dispatch:

jobs:
  github-actions-lint:
    permissions:
      contents: read
    uses: s-hirano-ist/s-templates/.github/workflows/github-actions-lint.yaml@f99b522f6bfc60282db65e697f173d25586afe45
