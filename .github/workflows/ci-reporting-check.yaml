name: CI reporting check

on:
  workflow_call:
    inputs:
      check:
        description: Check to run
        required: true
        type: string
jobs:
  run:
    name: ${{ inputs.check }}
    runs-on: ubuntu-24.04
    permissions:
      pull-requests: write
    timeout-minutes: 10
    concurrency:
      group: ${{ github.workflow }}-${{ inputs.check }}-${{ github.ref }}
    steps:
      - name: Checkout files
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          submodules: true

      - name: Verify .nvmrc satisfies package.json#engines.node
        if: ${{ inputs.check == 'oxfmt' }}
        run: |
          node --input-type=module -e '
            import packageJson from "./package.json" with { type: "json" };
            import { readFile } from "node:fs/promises";
            const version = (await readFile(".nvmrc", "utf8")).trim();
            const range = packageJson.engines.node;
            const major = version.split(".")[0];
            const satisfies = /^\d+\.\d+\.\d+$/.test(version) && range === major + ".x";
            if (!satisfies) {
              throw new Error(".nvmrc (" + version + ") does not satisfy engines.node (" + range + ")");
            }
          '

      - uses: ./.github/actions/setup-pnpm

      - name: Check formatting
        if: ${{ inputs.check == 'oxfmt' }}
        run: pnpm format:check

      - name: Generate Next.js route types
        if: ${{ inputs.check == 'lint' }}
        run: pnpm --filter s-private-app typegen
        env:
          SKIP_ENV_VALIDATION: "true"

      - name: Lint
        if: ${{ inputs.check == 'lint' }}
        run: pnpm lint
        env:
          SKIP_ENV_VALIDATION: "true"

      - name: Check unused code
        if: ${{ inputs.check == 'knip' }}
        run: pnpm knip

      - name: Build packages for tests
        if: ${{ inputs.check == 'test' }}
        run: pnpm packages:build

      - name: Install Playwright browsers
        if: ${{ inputs.check == 'test' }}
        run: pnpm exec playwright install

      - name: Test
        if: ${{ inputs.check == 'test' }}
        run: pnpm test
        env:
          LOCAL_DEV_MODE: "true"
          DATABASE_URL: "postgresql://ci:ci@localhost:26257/s_private?sslmode=verify-full"
          AUTH_SECRET: "ci-local-only-auth-secret"
          S3_ENDPOINT: "http://localhost:9000"
          S3_REGION: us-east-1
          S3_BUCKET_NAME: "s-private"
          S3_ACCESS_KEY_ID: "local-access-key"
          S3_SECRET_ACCESS_KEY: "local-secret-key"
          S3_FORCE_PATH_STYLE: "true"
          QDRANT_URL: "http://localhost:6333"
          QDRANT_COLLECTION_NAME: "knowledge_v1"
          EMBEDDING_URL: "http://localhost:3001"

      - name: Show coverage
        if: ${{ always() && inputs.check == 'test' }}
        uses: davelosert/vitest-coverage-report-action@74c2d9210b4fc44c84d8213f61d7ec99837b7aa0 # v2
        with:
          json-summary-path: ./.vitest-coverage/coverage-summary.json
          json-final-path: ./.vitest-coverage/coverage-final.json
