name: CI reporting check

on:
  workflow_call:
    inputs:
      check:
        description: Check to run
        required: true
        type: string
    secrets:
      SONAR_TOKEN:
        description: SonarQube Cloud analysis token (optional during setup)
        required: false
jobs:
  run:
    name: ${{ inputs.check }}
    runs-on: ubuntu-26.04
    permissions:
      pull-requests: write
    timeout-minutes: 10
    concurrency:
      group: ${{ github.workflow }}-${{ inputs.check }}-${{ github.ref }}
    steps:
      - name: Checkout files
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          submodules: true
          fetch-depth: ${{ inputs.check == 'test' && '0' || '1' }}

      - name: Verify .nvmrc satisfies package.json#engines.node
        if: ${{ inputs.check == 'oxfmt' }}
        run: |
          node --input-type=module -e '
            import packageJson from "./package.json" with { type: "json" };
            import { readFile } from "node:fs/promises";
            const version = (await readFile(".nvmrc", "utf8")).trim();
            const range = packageJson.engines.node;
            const major = version.split(".")[0];
            const satisfies = /^\d+\.\d+\.\d+$/.test(version) && range === major + ".x";
            if (!satisfies) {
              throw new Error(".nvmrc (" + version + ") does not satisfy engines.node (" + range + ")");
            }
          '

      - uses: $/.github/actions/setup-pnpm

      - name: Check formatting
        if: ${{ inputs.check == 'oxfmt' }}
        run: pnpm format:check

      - name: Generate Next.js route types
        if: ${{ inputs.check == 'lint' }}
        run: pnpm --filter s-private-app typegen
        env:
          SKIP_ENV_VALIDATION: "true"

      - name: Lint
        if: ${{ inputs.check == 'lint' }}
        run: pnpm lint
        env:
          SKIP_ENV_VALIDATION: "true"

      - name: Check unused code
        if: ${{ inputs.check == 'knip' }}
        run: pnpm knip

      - name: Build packages for tests
        if: ${{ inputs.check == 'test' }}
        run: pnpm packages:build

      - name: Install Playwright browsers
        if: ${{ inputs.check == 'test' }}
        run: pnpm exec playwright install

      - name: Test
        if: ${{ inputs.check == 'test' }}
        run: pnpm test
        env:
          LOCAL_DEV_MODE: "true"
          DATABASE_URL: "postgresql://ci:ci@localhost:26257/s_private?sslmode=verify-full"
          AUTH_SECRET: "ci-local-only-auth-secret"
          S3_ENDPOINT: "http://localhost:9000"
          S3_REGION: us-east-1
          S3_BUCKET_NAME: "s-private"
          S3_ACCESS_KEY_ID: "local-access-key"
          S3_SECRET_ACCESS_KEY: "local-secret-key"
          S3_FORCE_PATH_STYLE: "true"
          QDRANT_URL: "http://localhost:6333"
          QDRANT_COLLECTION_NAME: "knowledge_v1"
          EMBEDDING_URL: "http://localhost:3001"

      - name: Show coverage
        if: ${{ always() && inputs.check == 'test' }}
        uses: davelosert/vitest-coverage-report-action@v2.13.2
        with:
          json-summary-path: ./.vitest-coverage/coverage-summary.json
          json-final-path: ./.vitest-coverage/coverage-final.json

      - name: Prepare SonarQube analysis scope
        if: >-
          ${{ inputs.check == 'test' &&
              vars.SONAR_ORGANIZATION != '' && vars.SONAR_PROJECT_KEY != '' &&
              (github.event_name == 'push' ||
               (github.event.pull_request.base.ref == 'main' &&
                github.event.pull_request.head.repo.full_name == github.repository)) }}
        run: node scripts/prepare-sonar-scope.mjs > "$RUNNER_TEMP/sonar-project.properties"

      - name: Analyze with SonarQube Cloud (trial)
        if: >-
          ${{ inputs.check == 'test' &&
              vars.SONAR_ORGANIZATION != '' && vars.SONAR_PROJECT_KEY != '' &&
              (github.event_name == 'push' ||
               (github.event.pull_request.base.ref == 'main' &&
                github.event.pull_request.head.repo.full_name == github.repository)) }}
        continue-on-error: true
        uses: SonarSource/sonarqube-scan-action@59202af334b4ba7b5db01b701b8e79f8b3bef0f4 # v8.5.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_ORGANIZATION: ${{ vars.SONAR_ORGANIZATION }}
          SONAR_PROJECT_KEY: ${{ vars.SONAR_PROJECT_KEY }}
        with:
          args: >-
            -Dproject.settings=${{ runner.temp }}/sonar-project.properties
            -Dsonar.organization=${{ env.SONAR_ORGANIZATION }}
            -Dsonar.projectKey=${{ env.SONAR_PROJECT_KEY }}
