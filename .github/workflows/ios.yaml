name: ios

on:
  pull_request:
    paths:
      - ".github/workflows/ios.yaml"
      - ".mise.toml"
      - "apps/ios/**"
      - "packages/api-contracts/**"
      - "docs/openapi/backend-v1.json"
      - "scripts/generate-api.mjs"
      - "orval.config.ts"
  push:
    branches: [main]
    paths:
      - ".github/workflows/ios.yaml"
      - ".mise.toml"
      - "apps/ios/**"
      - "packages/api-contracts/**"
      - "docs/openapi/backend-v1.json"
      - "scripts/generate-api.mjs"
      - "orval.config.ts"

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: xcode-27
    timeout-minutes: 60
    steps:
      - name: Checkout files
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install XcodeGen
        uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
        with:
          version: 2026.11.1
          install_args: aqua:yonaskolb/XcodeGen

      - name: Generate Xcode project
        run: mise run ios:generate

      - name: Test generated API package
        run: swift test --package-path apps/ios/Packages/SPrivateAPI

      - name: Build app
        run: mise run ios:build

      - name: Run tests
        run: mise run ios:test
