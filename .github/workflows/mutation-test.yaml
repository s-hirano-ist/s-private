name: mutation-test
permissions: {}

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - "package.json"
      - "pnpm-workspace.yaml"
      - "pnpm-lock.yaml"
      - "packages/core/**/*.ts"
      - "stryker.config.json"
jobs:
  mutation-test:
    runs-on: ubuntu-26.04
    permissions: {}
    timeout-minutes: 30
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}
    steps:
      - name: Checkout files
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          submodules: true

      - uses: $/.github/actions/setup-pnpm
      # Stryker 10 reports a lower mutation score with Vitest 5. Keep the
      # compatibility version isolated to this disposable CI checkout.
      - run: pnpm add -Dw --ignore-scripts vitest@4.1.11 # zizmor: ignore[adhoc-packages] -- Exact compatibility version in a disposable checkout.
      - run: pnpm test:mutation:core

      - name: Upload mutation report
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: mutation-report
          path: reports/mutation/
          retention-days: 14
