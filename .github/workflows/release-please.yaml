name: release-please

permissions: {}

on:
  push:
    branches:
      - main

jobs:
  release-please:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions: {}
    outputs:
      releases_created: ${{ steps.release.outputs.releases_created }}
      paths_released: ${{ steps.release.outputs.paths_released }}
      ui_release_created: ${{ steps.release.outputs['packages/ui--release_created'] }}
      scripts_release_created: ${{ steps.release.outputs.release_created }}
    steps:
      # App token 起点の PR は後続 CI を発火できる。GITHUB_TOKEN は使用しない。
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.RENOVATE_CLIENT_ID }}
          private-key: ${{ secrets.RENOVATE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5
        id: release
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: .release-please-config.json
          manifest-file: .release-please-manifest.json

  publish-packages:
    needs: release-please
    if: ${{ needs.release-please.outputs.releases_created == 'true' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-pnpm
        with:
          registry-url: "https://registry.npmjs.org"

      - name: Build packages
        run: pnpm packages:build

      - name: Publish @s-hirano-ist/s-ui
        if: ${{ needs.release-please.outputs.ui_release_created == 'true' }}
        working-directory: packages/ui
        run: pnpm publish --no-git-checks --access public --provenance

      - name: Publish @s-hirano-ist/s-scripts
        if: ${{ needs.release-please.outputs.scripts_release_created == 'true' }}
        working-directory: packages/scripts
        run: pnpm publish --no-git-checks --access public --provenance
