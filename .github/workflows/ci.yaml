name: ci
permissions: {}

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  checks:
    strategy:
      fail-fast: false
      matrix:
        check: [build, supplemental-lint, storybook, docs, schema-locked, api-contract]
    permissions: {}
    uses: ./.github/workflows/ci-check.yaml # zizmor: ignore[self-repository] -- actionlint 1.7.12 does not support $/ workflow calls yet.
    with:
      check: ${{ matrix.check }}

  reporting-checks:
    strategy:
      fail-fast: false
      matrix:
        check: [oxfmt, lint, knip, test]
    permissions:
      pull-requests: write
    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    uses: ./.github/workflows/ci-reporting-check.yaml # zizmor: ignore[self-repository] -- actionlint 1.7.12 does not support $/ workflow calls yet.
    with:
      check: ${{ matrix.check }}
