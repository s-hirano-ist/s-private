name: ci
permissions:
  pull-requests: write

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]
jobs:
  build:
    runs-on: ubuntu-24.04
    permissions: {}
    timeout-minutes: 10
    concurrency:
      group: ${{ github.workflow }}-build-${{ github.ref }}
    steps:
      - name: Checkout files
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false
          submodules: true

      # Defense-in-depth: NODE_TLS_REJECT_UNAUTHORIZED=0 はプロセス全体の TLS 検証を
      # 無効化する。CI/Secrets への混入を防ぐためビルド前にガードする（本番ランタイムの
      # fail-close は app/src/instrumentation.ts が別途担保）。
      - name: Guard against NODE_TLS_REJECT_UNAUTHORIZED
        run: |
          if [ "${NODE_TLS_REJECT_UNAUTHORIZED:-}" = "0" ]; then
            echo "::error::NODE_TLS_REJECT_UNAUTHORIZED=0 must never be set in CI"
            exit 1
          fi

      - uses: ./.github/actions/setup-pnpm
      - run: pnpm build
        env: &build_env
          # CI は外部サービスに接続しない。env schema と build-time imports が要求する
          # 非機密のローカル向けプレースホルダーだけを与える。
          DATABASE_URL: "postgresql://ci:ci@localhost:26257/s_private?sslmode=verify-full"
          AUTH_SECRET: "ci-local-only-auth-secret"
          MINIO_HOST: "localhost"
          MINIO_PORT: "9000"
          MINIO_BUCKET_NAME: "s-private"
          MINIO_ACCESS_KEY: "local-access-key"
          MINIO_SECRET_KEY: "local-secret-key"
          MINIO_USE_SSL: "false"
          QDRANT_URL: "http://localhost:6333"
          QDRANT_COLLECTION_NAME: "knowledge_v1"
          EMBEDDING_URL: "http://localhost:3001"

  oxfmt:
    runs-on: ubuntu-24.04
    permissions:
      pull-requests: write
    timeout-minutes: 10
    concurrency:
      group: ${{ github.workflow }}-oxfmt-${{ github.ref }}
    steps:
      - name: Checkout files
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false
          submodules: true

      - name: Verify .nvmrc satisfies package.json#engines.node
        run: |
          node --input-type=module -e '
            import packageJson from "./package.json" with { type: "json" };
            import { readFile } from "node:fs/promises";
            const version = (await readFile(".nvmrc", "utf8")).trim();
            const range = packageJson.engines.node;
            const minimum = range.match(/^>=(\d+)(?:\.(\d+))?(?:\.(\d+))?$/)?.slice(1).map((part) => Number(part ?? 0));
            const current = version.split(".").slice(0, 3).map(Number);
            const differenceIndex = minimum && current.findIndex((part, index) => part !== minimum[index]);
            const satisfies = minimum && current.length === 3 && current.every(Number.isInteger) &&
              (differenceIndex === -1 || current[differenceIndex] > minimum[differenceIndex]);
            if (!satisfies) {
              throw new Error(".nvmrc (" + version + ") does not satisfy engines.node (" + range + ")");
            }
          '

      - uses: ./.github/actions/setup-pnpm
      - run: pnpm format:check

  lint:
    runs-on: ubuntu-24.04
    permissions:
      pull-requests: write
    timeout-minutes: 10
    concurrency:
      group: ${{ github.workflow }}-lint-${{ github.ref }}
    steps:
      - name: Checkout files
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false
          submodules: true

      - uses: ./.github/actions/setup-pnpm
      # Next.js typedRoutes 由来の Route 型は `next typegen` で
      # `app/.next/types/` に生成される。これが無いと CI 環境で
      # `as Route` キャストが「不要」と判定され lint が落ちるため、
      # lint 前に必ず型生成を走らせる。
      - run: pnpm --filter s-private-app typegen
        env:
          SKIP_ENV_VALIDATION: "true"
      - run: pnpm lint
        env:
          SKIP_ENV_VALIDATION: "true"

  supplemental-lint:
    runs-on: ubuntu-24.04
    permissions: {}
    timeout-minutes: 10
    concurrency:
      group: ${{ github.workflow }}-supplemental-lint-${{ github.ref }}
    steps:
      - name: Checkout files
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false
          submodules: true

      - uses: ./.github/actions/setup-pnpm
      - run: pnpm harness:check
      - name: Install native lint tools
        uses: jdx/mise-action@9e7f7633ff6f6d6048a9418a68d48f288f50eb14 # v4.2.3
        with:
          version: 2026.8.6
          install_args: rumdl gitleaks
      - run: pnpm lint:css
      - run: pnpm lint:md
      - run: pnpm lint:secret

  knip:
    runs-on: ubuntu-24.04
    permissions:
      pull-requests: write
    timeout-minutes: 10
    concurrency:
      group: ${{ github.workflow }}-knip-${{ github.ref }}
    steps:
      - name: Checkout files
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false
          submodules: true

      - uses: ./.github/actions/setup-pnpm
      - run: pnpm knip

  test:
    runs-on: ubuntu-24.04
    permissions:
      pull-requests: write
    timeout-minutes: 10
    concurrency:
      group: ${{ github.workflow }}-test-${{ github.ref }}
    steps:
      - name: Checkout files
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false
          submodules: true

      - uses: ./.github/actions/setup-pnpm
      - run: pnpm packages:build
      - run: pnpm exec playwright install
      - run: pnpm test
        env: *build_env
      - name: Show coverage
        if: always()
        uses: davelosert/vitest-coverage-report-action@3c50566c523e04813df28de8f7c48dd97d663f1c # v2
        with:
          json-summary-path: ./.vitest-coverage/coverage-summary.json
          json-final-path: ./.vitest-coverage/coverage-final.json

  storybook:
    runs-on: ubuntu-24.04
    permissions: {}
    timeout-minutes: 10
    concurrency:
      group: ${{ github.workflow }}-storybook-${{ github.ref }}
    steps:
      - name: Checkout files
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false
          submodules: true

      - uses: ./.github/actions/setup-pnpm
      - run: pnpm storybook:build
        env:
          SKIP_ENV_VALIDATION: "true"

  docs:
    runs-on: ubuntu-24.04
    permissions: {}
    timeout-minutes: 10
    concurrency:
      group: ${{ github.workflow }}-docs-${{ github.ref }}
    steps:
      - name: Checkout files
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false
          submodules: true

      - uses: ./.github/actions/setup-pnpm
      - name: Build TypeDoc
        run: pnpm docs:build

  schema-locked:
    runs-on: ubuntu-24.04
    permissions: {}
    timeout-minutes: 10
    concurrency:
      group: ${{ github.workflow }}-schema-locked-${{ github.ref }}
    steps:
      - name: Checkout files
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false
          submodules: true

      - uses: ./.github/actions/setup-pnpm
      # CockroachDB v26.1+ では新規 CREATE TABLE に `WITH (schema_locked = false)`
      # が無いと `prisma migrate deploy` が P3018 で失敗する。マイグレーション SQL の
      # 付与漏れをマージ前に検知する。
      - run: pnpm check:schema-locked
