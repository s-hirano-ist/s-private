name: rss-refresh

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: rss-refresh-production
  cancel-in-progress: false

jobs:
  refresh:
    if: github.repository == 's-hirano-ist/s-private' && vars.RSS_CRON_ENABLED == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 6
    steps:
      - name: Refresh due RSS subscriptions
        env:
          BACKEND_URL: ${{ vars.RSS_BACKEND_URL }}
          CRON_SECRET: ${{ secrets.RSS_CRON_SECRET }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$BACKEND_URL"
          [[ "$BACKEND_URL" == https://* ]]
          test -n "$CRON_SECRET"
          curl --fail --silent --show-error --max-time 270 \
            --header "Authorization: Bearer $CRON_SECRET" \
            "${BACKEND_URL%/}/api/cron/rss-refresh"
