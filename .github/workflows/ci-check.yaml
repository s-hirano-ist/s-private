name: CI check

on:
  workflow_call:
    inputs:
      check:
        description: Check to run
        required: true
        type: string
jobs:
  run:
    name: ${{ inputs.check }}
    runs-on: ubuntu-24.04
    permissions: {}
    timeout-minutes: 10
    concurrency:
      group: ${{ github.workflow }}-${{ inputs.check }}-${{ github.ref }}
    steps:
      - name: Checkout files
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          submodules: true

      - name: Guard against NODE_TLS_REJECT_UNAUTHORIZED
        if: ${{ inputs.check == 'build' }}
        run: |
          if [ "${NODE_TLS_REJECT_UNAUTHORIZED:-}" = "0" ]; then
            echo "::error::NODE_TLS_REJECT_UNAUTHORIZED=0 must never be set in CI"
            exit 1
          fi

      - uses: ./.github/actions/setup-pnpm

      - name: Build application
        if: ${{ inputs.check == 'build' }}
        run: pnpm build
        env:
          BACKEND_URL: "https://backend.example.com"

      - name: Verify publication boundary and CLI consumer
        if: ${{ inputs.check == 'build' }}
        run: |
          pnpm check:publish
          pnpm check:cli-package

      - name: Check harness
        if: ${{ inputs.check == 'supplemental-lint' }}
        run: pnpm harness:check

      - name: Install native lint tools
        if: ${{ inputs.check == 'supplemental-lint' }}
        uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
        with:
          version: 2026.11.0
          install_args: rumdl gitleaks

      - name: Lint CSS, Markdown and secrets
        if: ${{ inputs.check == 'supplemental-lint' }}
        run: |
          pnpm lint:css
          pnpm lint:md
          pnpm lint:secret

      - name: Build Storybook
        if: ${{ inputs.check == 'storybook' }}
        run: pnpm storybook:build
        env:
          SKIP_ENV_VALIDATION: "true"

      - name: Build TypeDoc
        if: ${{ inputs.check == 'docs' }}
        run: pnpm docs:build

      - name: Check schema locking
        if: ${{ inputs.check == 'schema-locked' }}
        run: pnpm check:schema-locked

      - name: Check OpenAPI snapshot and generate typed clients
        if: ${{ inputs.check == 'api-contract' }}
        run: |
          pnpm api:check
          pnpm --filter @s-hirano-ist/s-api-client typecheck
