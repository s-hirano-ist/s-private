name: "Setup pnpm + Node"
description: "pnpm + Node + dependency install with integrated cache. Caller must checkout the repo first."

inputs:
  install:
    description: "Run 'pnpm i --frozen-lockfile' after setup."
    required: false
    default: "true"
  registry-url:
    description: "Forwarded to actions/setup-node (used by npm publish flows)."
    required: false
    default: ""

runs:
  using: "composite"
  steps:
    - name: Install pnpm
      uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6
      with:
        run_install: false

    - name: Install Node.js
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
      with:
        node-version-file: ".nvmrc"
        cache: pnpm
        cache-dependency-path: pnpm-lock.yaml
        registry-url: ${{ inputs.registry-url }}

    - name: Install dependencies
      if: ${{ inputs.install == 'true' }}
      shell: bash
      run: pnpm i --frozen-lockfile
