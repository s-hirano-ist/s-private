# Node version SSOT: .nvmrc (mise reads it via idiomatic_version_file_enable_tools)
[settings]
idiomatic_version_file_enable_tools = ["node"]

[env]
_.file = ".env.local"

[tools]
pnpm = "11.22.0"
doppler = { version = "3.76.5", exe = "doppler" }
"npm:agent-browser" = "0.35.1"
rumdl = "v0.2.62"
gitleaks = "8.30.1"
